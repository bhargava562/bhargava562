<svg width="680" height="140" viewBox="0 0 680 140" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style><![CDATA[
      .bg { fill: #000000; }
      .base {
        font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
        font-size: 52px;
        font-weight: 700;
        text-anchor: middle;
        dominant-baseline: middle;
        letter-spacing: 2px;
      }
      .cyan { fill: #00fff9; opacity: 0.85; animation: gcyan 3.2s infinite steps(1); }
      .red  { fill: #ff003c; opacity: 0.85; animation: gred 3.2s infinite steps(1); }
      .main { fill: #00FF9C; animation: flick 4.6s infinite; }
      .scan { fill: url(#sg); opacity: 0.18; animation: smove 3.6s linear infinite; }
      .noiseline { stroke: #00FF9C; stroke-width: 1; opacity: 0.08; }
      @keyframes gcyan {
        0%, 90%, 100% { transform: translate(0,0); }
        91% { transform: translate(-4px,-2px); }
        92% { transform: translate(3px,1px); }
        93% { transform: translate(-2px,1px); }
        94% { transform: translate(0,0); }
      }
      @keyframes gred {
        0%, 90%, 100% { transform: translate(0,0); }
        91% { transform: translate(4px,2px); }
        92% { transform: translate(-3px,-1px); }
        93% { transform: translate(2px,-1px); }
        94% { transform: translate(0,0); }
      }
      @keyframes flick {
        0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% { opacity: 1; }
        20%, 24%, 55% { opacity: 0.55; }
      }
      @keyframes smove {
        0% { transform: translateY(-60%); }
        100% { transform: translateY(160%); }
      }
    ]]></style>
    <linearGradient id="sg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00FF9C" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00FF9C" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#00FF9C" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect class="bg" width="100%" height="100%"/>
  <line class="noiseline" x1="0" y1="0" x2="100%" y2="0"/>
  <line class="noiseline" x1="0" y1="10" x2="100%" y2="10"/>
  <line class="noiseline" x1="0" y1="20" x2="100%" y2="20"/>
  <line class="noiseline" x1="0" y1="30" x2="100%" y2="30"/>
  <line class="noiseline" x1="0" y1="40" x2="100%" y2="40"/>
  <line class="noiseline" x1="0" y1="50" x2="100%" y2="50"/>
  <line class="noiseline" x1="0" y1="60" x2="100%" y2="60"/>
  <line class="noiseline" x1="0" y1="70" x2="100%" y2="70"/>
  <line class="noiseline" x1="0" y1="80" x2="100%" y2="80"/>
  <line class="noiseline" x1="0" y1="90" x2="100%" y2="90"/>
  <line class="noiseline" x1="0" y1="100" x2="100%" y2="100"/>
  <line class="noiseline" x1="0" y1="110" x2="100%" y2="110"/>
  <line class="noiseline" x1="0" y1="120" x2="100%" y2="120"/>
  <line class="noiseline" x1="0" y1="130" x2="100%" y2="130"/>
  <rect class="scan" x="0" y="0" width="100%" height="35%"/>
  <text x="50%" y="52%" class="base cyan">BHARGAVA.SYS</text>
  <text x="50%" y="52%" class="base red">BHARGAVA.SYS</text>
  <text x="50%" y="52%" class="base main">BHARGAVA.SYS</text>
</svg>
