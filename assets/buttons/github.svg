<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 120 36" width="120" height="36" role="img" aria-label="GITHUB">
  <title>GITHUB</title>
  <defs>
    <style>
      .btn-bg { transition: fill 0.2s ease; }
      .btn-border { transition: stroke 0.2s ease, stroke-width 0.2s ease; }
      .btn-arrow { transition: transform 0.2s ease, opacity 0.2s ease; }
      .btn-group:hover .btn-bg { fill: #131c31; }
      .btn-group:hover .btn-border { stroke-width: 1.5; stroke-opacity: 1; }
      .btn-group:hover .btn-arrow { opacity: 1; transform: translate(103px, 12.5px); }
      .btn-text {
        font-family: 'JetBrains Mono', Consolas, 'Fira Code', 'Segoe UI Mono', monospace;
        font-size: 12.5px;
        font-weight: 700;
        letter-spacing: 0.5px;
        fill: #FFFFFF;
      }
    </style>
    <linearGradient id="bg-grad-github" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1424" />
      <stop offset="100%" stop-color="#080d1a" />
    </linearGradient>
    <linearGradient id="glow-github" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>
  </defs>
  <g class="btn-group" cursor="pointer">
    <!-- Background card -->
    <rect class="btn-bg" x="0.5" y="0.5" width="119" height="35" rx="7.5" fill="url(#bg-grad-github)" />
    <rect x="0.5" y="0.5" width="119" height="35" rx="7.5" fill="url(#glow-github)" />
    <rect class="btn-border" x="0.5" y="0.5" width="119" height="35" rx="7.5" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.65" />
    
    <!-- Icon -->
    <image x="10" y="8" width="20" height="20" preserveAspectRatio="xMidYMid meet" xlink:href="data:image/png;base64," href="data:image/png;base64," />
    
    <!-- Text Label -->
    <text class="btn-text" x="38" y="18" dominant-baseline="central">GITHUB</text>
    
    <!-- Subtle arrow indicator ↗ -->
    <g class="btn-arrow" transform="translate(102, 13.5)" stroke="#FFFFFF" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.75">
      <path d="M1 7.5 L7.5 1 M3 1 L7.5 1 L7.5 5.5" />
    </g>
  </g>
</svg>
