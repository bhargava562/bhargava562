<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 104 100" width="104" height="100" role="img" aria-label="HackerRank">
  <title>HackerRank</title>
  <defs>
    <filter id="shadow-hackerrank" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="4" stdDeviation="4.5" flood-color="#000000" flood-opacity="0.65" />
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#00EA64" flood-opacity="0.45" />
    </filter>
    <style>
      @keyframes float {
        0%, 100% {
          transform: translateY(0px);
        }
        50% {
          transform: translateY(-4px);
        }
      }
      .btn-logo {
        filter: url(#shadow-hackerrank);
        animation: float 3.2s ease-in-out 0.7s infinite;
        transform-origin: center;
        transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.25s ease;
      }
      .btn-label {
        font-family: 'JetBrains Mono', Consolas, 'Fira Code', 'Segoe UI Mono', monospace;
        font-size: 11.5px;
        font-weight: 600;
        letter-spacing: 0.3px;
        fill: #1e293b;
        transition: fill 0.2s ease;
      }
      @media (prefers-color-scheme: dark) {
        .btn-label {
          fill: #f0f6fc;
        }
      }
      .btn-group:hover .btn-logo {
        transform: translateY(-6px) scale(1.06);
      }
      .btn-group:hover .btn-label {
        fill: #00FF9C;
      }
      @media (prefers-color-scheme: dark) {
        .btn-group:hover .btn-label {
          fill: #00FF9C;
        }
      }
    </style>
  </defs>
  <g class="btn-group" cursor="pointer">
    <!-- Elevated Logo with Ambient Glow & Floating Animation -->
    <g class="btn-logo">
      <image x="20.0" y="8.0" width="64" height="64" preserveAspectRatio="xMidYMid meet" xlink:href="data:image/png;base64," href="data:image/png;base64," />
    </g>
    
    <!-- Text Label Below Button -->
    <text class="btn-label" x="52.0" y="90.0" text-anchor="middle">HackerRank</text>
  </g>
</svg>
