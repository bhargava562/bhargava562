<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 72 74" width="72" height="74" role="img" aria-label="Gmail">
  <title>Gmail</title>
  <defs>
    <style>
      .btn-bg { transition: fill 0.2s ease; }
      .btn-border { transition: stroke 0.2s ease, stroke-width 0.2s ease, stroke-opacity 0.2s ease; }
      .btn-label {
        font-family: 'JetBrains Mono', Consolas, 'Fira Code', 'Segoe UI Mono', monospace;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.3px;
        fill: #94a3b8;
        transition: fill 0.2s ease;
      }
      .btn-group:hover .btn-bg { fill: #131c31; }
      .btn-group:hover .btn-border { stroke-width: 1.6; stroke-opacity: 1; stroke: #EA4335; }
      .btn-group:hover .btn-label { fill: #ffffff; }
    </style>
    <linearGradient id="bg-grad-gmail" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1424" />
      <stop offset="100%" stop-color="#080d1a" />
    </linearGradient>
    <linearGradient id="glow-gmail" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EA4335" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#EA4335" stop-opacity="0.0" />
    </linearGradient>
  </defs>
  <g class="btn-group" cursor="pointer">
    <!-- Square Button Card (No text inside) -->
    <rect class="btn-bg" x="12.5" y="2.5" width="47" height="47" rx="10" fill="url(#bg-grad-gmail)" />
    <rect x="12.5" y="2.5" width="47" height="47" rx="10" fill="url(#glow-gmail)" />
    <rect class="btn-border" x="12.5" y="2.5" width="47" height="47" rx="10" fill="none" stroke="#EA4335" stroke-width="1.2" stroke-opacity="0.65" />
    
    <!-- Centered Logo (Medium size) -->
    <image x="22.0" y="12.0" width="28" height="28" preserveAspectRatio="xMidYMid meet" xlink:href="data:image/png;base64," href="data:image/png;base64," />
    
    <!-- Text Label Below Button -->
    <text class="btn-label" x="36.0" y="66.0" text-anchor="middle">Gmail</text>
  </g>
</svg>
