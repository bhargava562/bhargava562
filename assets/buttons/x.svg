<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 104 96" width="104" height="96" role="img" aria-label="X">
  <title>X</title>
  <defs>
    <filter id="shadow-x" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="4.5" flood-color="#000000" flood-opacity="0.65" />
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#E2E8F0" flood-opacity="0.45" />
    </filter>
    <style>
      .btn-logo {
        filter: url(#shadow-x);
        transition: transform 0.2s ease, filter 0.2s ease;
      }
      .btn-label {
        font-family: 'JetBrains Mono', Consolas, 'Fira Code', 'Segoe UI Mono', monospace;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.3px;
        fill: #94a3b8;
        transition: fill 0.2s ease;
      }
      .btn-group:hover .btn-logo {
        transform: translateY(-2px);
      }
      .btn-group:hover .btn-label {
        fill: #ffffff;
      }
    </style>
  </defs>
  <g class="btn-group" cursor="pointer">
    <!-- Elevated Logo with Ambient Glow & Drop Shadow -->
    <image class="btn-logo" x="20.0" y="4.0" width="64" height="64" preserveAspectRatio="xMidYMid meet" xlink:href="data:image/png;base64," href="data:image/png;base64," />
    
    <!-- Text Label Below Button -->
    <text class="btn-label" x="52.0" y="86.0" text-anchor="middle">X</text>
  </g>
</svg>
